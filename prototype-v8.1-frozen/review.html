<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1672 × 941 真 UI 對稿檢視</title><style>*{box-sizing:border-box}body{margin:0;background:#202733;color:#e9edf6;font:13px system-ui}header{display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}header strong{font-size:14px}select,a{font:inherit;color:inherit;background:#344154;border:1px solid #8091ab;border-radius:5px;padding:5px 8px}#frameBox{margin:0 12px;position:relative;overflow:hidden}iframe{width:1672px;height:941px;border:0;transform-origin:top left;position:absolute;left:0;top:0}p{margin:7px 16px;color:#b9c8db;font-size:11px}</style><header><strong>對稿檢視 · 真實 HTML</strong><label>風格 <select id="theme"><option value="natural">自然靜謐</option><option value="neon">未來霓虹</option><option value="warm">溫暖插畫</option><option value="minimal">極簡資訊</option></select></label><label>畫面 <select id="viewport"><option value="desktop">1672 × 941 桌面</option><option value="mobile">390 × 844 窄屏</option></select></label><span id="size"></span><a href="index.html" target="_blank">開啟正常原型</a></header><div id="frameBox"><iframe id="preview" title="1672乘941真實原型，固定對稿狀態"></iframe></div><p>內頁 CSS viewport 可選 1672 × 941／390 × 844，以等比例縮放顯示；不是截圖。18:42／11月1日示範狀態，不讀寫保存設定。四風格共用自然靜謐的版面幾何；切風格保留使用者位置與尺寸。頁內所有按鈕仍可操作。</p><script>const frame=document.querySelector('#preview'),box=document.querySelector('#frameBox');function size(){const mobile=document.querySelector('#viewport').value==='mobile',w=mobile?390:1672,h=mobile?844:941,scale=Math.min(1,(innerWidth-24)/w);frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform='scale('+scale+')';box.style.width=(w*scale)+'px';box.style.height=(h*scale)+'px';document.querySelector('#size').textContent=w+' × '+h+' CSS px · 顯示 '+(scale*100).toFixed(1)+'%'}function show(){frame.src='index.html?review=1&theme='+document.querySelector('#theme').value}document.querySelector('#theme').onchange=show;document.querySelector('#viewport').onchange=size;addEventListener('resize',size);size();show();</script></html>
