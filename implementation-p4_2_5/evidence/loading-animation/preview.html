<!doctype html><html data-atmos-loading="true"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atmos loading effect preview</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}/* Inline and self-contained: hide staged UI even if external assets fail. */

#atmosBootNotice{position:fixed;inset:0;z-index:2147483000;isolation:isolate;display:grid;place-items:center;align-items:safe center;overflow:auto;overscroll-behavior:contain;padding:32px 20px;margin:0;background:#07151d;color:#e7fff5;text-align:center;font:14px/1.6 system-ui,sans-serif}

#atmosBootNotice .boot-trace{stroke-dasharray:1;stroke-dashoffset:0;animation:boot-trace 3.8s ease-in-out infinite}
#atmosBootNotice .boot-sun{transform-box:fill-box;transform-origin:center;animation:boot-sun 4.2s ease-in-out infinite}
#atmosBootNotice .boot-wordmark{padding-left:.34em;font-size:34px;font-weight:500;line-height:1.2;letter-spacing:.34em;color:#e5fff4;text-shadow:0 0 30px #7cebd733}

#atmosBootNotice a svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#atmosBootNotice a:hover{color:#effff6;border-color:#83dcca8c;background:#234e5370}
#atmosBootNotice a:focus-visible{outline:3px solid #ffdaa0;outline-offset:4px}
#atmosBootNotice[data-state="error"] *{animation-play-state:paused !important}
#atmosBootNotice[data-state="error"] .boot-content{animation:none !important;opacity:1;transform:none}
#atmosBootNotice[data-state="error"] #atmosBootMessage{color:#ffdda5}
#atmosBootNotice[data-state="error"] .boot-caption{color:#c4bfb1}
#atmosBootNotice[data-state="error"] a{color:#ffebc8;border-color:#e1b97d99;background:#3b30266e}
#atmosBootNotice[data-state="error"] .boot-track{opacity:.25}
@keyframes boot-orbit{to{transform:rotate(360deg)}}
@keyframes boot-drift-a{to{transform:translate(20%,12%) rotate(14deg) scale(1.12)}}
@keyframes boot-drift-b{to{transform:translate(-16%,-8%) rotate(-18deg) scale(1.08)}}
@keyframes boot-breathe{50%{transform:scale(1.1);opacity:.55}}
@keyframes boot-sun{50%{transform:scale(.92);opacity:.82}}
@keyframes boot-trace{0%{stroke-dashoffset:1;opacity:.35}48%,80%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:.35}}
@keyframes boot-scan{to{transform:translateX(325%)}}
@keyframes boot-enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:380px){#atmosBootNotice{padding:20px 16px}#atmosBootNotice .boot-emblem{width:180px;height:180px}#atmosBootNotice .boot-core{inset:36px;border-radius:26px}#atmosBootNotice .boot-wordmark{font-size:29px}}
@media(max-height:480px){#atmosBootNotice{padding:12px}#atmosBootNotice .boot-content{padding:8px;gap:8px}#atmosBootNotice .boot-emblem{width:134px;height:134px;margin:0}#atmosBootNotice .boot-core{inset:27px;border-radius:20px}#atmosBootNotice .boot-wordmark{font-size:24px}#atmosBootNotice .boot-steps{display:none}#atmosBootNotice a{margin-top:0}}
@media(max-height:260px){#atmosBootNotice .boot-emblem,#atmosBootNotice .boot-caption{display:none}#atmosBootNotice .boot-wordmark{font-size:20px}#atmosBootNotice .boot-content{gap:6px}#atmosBootNotice .boot-track{width:130px}}
@media(prefers-reduced-motion:reduce){#atmosBootNotice *,#atmosBootNotice *::before,#atmosBootNotice *::after{animation:none !important;transition:none !important}#atmosBootNotice .boot-track span{left:28%;transform:none}}

<script>// Initial-page gate only. Preserve layout measurements while concealing staged UI.
(()=>{
 const root=document.documentElement,loading=()=>root.hasAttribute('data-atmos-loading');
 const frame=()=>new Promise(resolve=>requestAnimationFrame(resolve));
 const text=(id,message)=>{const node=document.getElementById(id);if(node&&node.textContent!==message)node.textContent=message};
 const stage=phase=>{if(!loading())return;const node=document.getElementById('atmosBootNotice');if(!node||node.dataset.state==='error')return;const labels={connect:'正在連接本機設定',scene:'正在同步場景與圖片',layout:'正在整理字型與版面'};if(!labels[phase])return;node.dataset.stage=phase;text('atmosBootStage',labels[phase])};
 window.AtmosBootVisibility={
  stage,
  async settle(){
   if(!loading())return;
   stage('layout');
   let timer;
   try{await Promise.race([(async()=>{
    for(const link of document.querySelectorAll('link[rel="stylesheet"]'))if(!link.sheet||!link.sheet.cssRules.length)throw Error('Required stylesheet failed to load');
    await document.fonts?.ready;
    const node=document.getElementById('atmosBootNotice');if(node?.dataset.state==='error'){node.dataset.state='loading';node.setAttribute('aria-busy','true');text('atmosBootMessage','正在載入 Atmos，請稍候…');stage('layout')}
    await Promise.allSettled([...document.querySelectorAll('.scene-picker-top img')].map(image=>image.decode()));
    await document.fonts?.ready;
    window.AtmosCanvas?.resize();window.atmosBridgeApp?.syncGeometry();window.atmosBridgeWidgets?.syncGeometry();window.atmosSchedulePanelAlign?.();
    await frame();await frame();
   })(),new Promise((_,reject)=>{timer=setTimeout(()=>reject(Error('Initial layout readiness timed out')),10000)})])}finally{clearTimeout(timer)}
  },
  reveal(){root.removeAttribute('data-atmos-loading');document.getElementById('atmosBootNotice')?.remove()},
  fail(){if(!loading())return;const node=document.getElementById('atmosBootNotice');if(node){node.dataset.state='error';node.setAttribute('aria-busy','false')}text('atmosBootMessage','Atmos 尚未完成載入。請檢查連線後重新載入。');text('atmosBootStage','確認連線後，可以重新嘗試。')}
 };
})();
</script><script>window.AtmosBootVisibility.stage('scene');</script></html>
