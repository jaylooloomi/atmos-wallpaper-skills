[package]
name = "atmos-wallpaper-desktop"
version = "0.7.15"
edition = "2021"
publish = false
description = "Atmos Wallpaper Windows desktop host"

[[bin]]
name = "atmos-wallpaper"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
cpal = "=0.18.2"
windows = { version = "=0.62.2", features = ["Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Devices_Display", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_Com", "Win32_System_StationsAndDesktops", "Win32_System_WindowsProgramming", "Win32_Security"] }

[profile.release]
lto = "thin"
strip = true
