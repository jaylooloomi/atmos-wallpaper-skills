[package]
name = "atmos-wallpaper-desktop"
version = "0.7.36"
edition = "2021"
publish = false
description = "Atmos Wallpaper Windows desktop host"
autobins = false

[features]
default = ["native-runtime"]
native-core = ["dep:reqwest", "dep:tokio", "dep:scraper", "dep:roxmltree", "dep:httpdate", "dep:ical", "dep:rrule", "dep:chrono", "dep:chrono-tz", "dep:iana-time-zone"]
http-fixture = ["native-core"]
native-runtime = ["native-core"]

[[bin]]
name = "atmos-wallpaper"
path = "src/main.rs"

[[bin]]
name = "atmos-http-fixture"
path = "src/bin/http-boundary-fixture.rs"
required-features = ["http-fixture"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "=0.21.7"
httparse = "=1.10.1"
subtle = "=2.6.1"
getrandom = "=0.3.4"
regex = "=1.13.1"
ryu-js = "=1.0.3"
time = { version = "=0.3.55", features = ["formatting", "parsing"] }

[target.'cfg(windows)'.dependencies]
reqwest = { version = "=0.13.5", optional = true, default-features = false, features = ["native-tls-no-alpn"] }
tokio = { version = "=1.54.1", optional = true, features = ["net", "rt-multi-thread", "time"] }
scraper = { version = "=0.29.0", optional = true, default-features = false }
roxmltree = { version = "=0.21.2", optional = true }
httpdate = { version = "=1.0.3", optional = true }
ical = { version = "=0.11.0", optional = true, default-features = false, features = ["ical"] }
rrule = { version = "=0.14.0", optional = true, features = ["exrule"] }
chrono = { version = "0.4", optional = true, default-features = false, features = ["std"] }
chrono-tz = { version = "0.10", optional = true }
iana-time-zone = { version = "0.1", optional = true }
webview2-com = "=0.39.1"
cpal = "=0.18.2"
windows = { version = "=0.62.2", features = ["Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Devices_Display", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Console", "Win32_System_Registry", "Win32_System_Time", "Win32_System_Com", "Win32_System_StationsAndDesktops", "Win32_System_WindowsProgramming", "Win32_Security", "Win32_Security_Cryptography"] }

[profile.release]
lto = "thin"
strip = true
